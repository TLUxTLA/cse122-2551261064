<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        /* Định dạng toàn bộ trang web */
        body{
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Khung bao bài thơ */
        .khung-tho{
            width: 640px;
            max-width: calc(100% - 50px);
            padding: 24px;
            background-color: #FFFDE7;
            border: 1px solid #9E9E9E;
            text-align: center;
        }

        /* Tiêu đề bài thơ */
        h1{
            color: #D40000;
            background-color: #FFD9E6;
            font-size: 26px;
            font-weight: bold;
            padding: 6px 0;
            margin: 0 0 20px;
        }

        /* Định dạng chung cho các khổ thơ */
        p{
            font-style: italic;
            text-align: center;
            line-height: 1.7;
            margin: 0;
        }

        /* Khổ thơ màu xanh */
        .kho-xanh {
            color: #0033CC;
        }

        /* Khổ thơ màu đỏ */
        .kho-do {
            color: #D40000;
        }

        /* Đường kẻ ngang giữa các khổ */
        hr{
            width: 55%;
            border: none;
            border-top: 1px solid #0033CC;
            margin: 16px auto;
        }
    </style>
</head>

<body>

    <article class="khung-tho">

        <h1>BỐN MÙA</h1>

        <p class="kho-xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr>

        <p class="kho-do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>

        <p class="kho-xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>

    </article>

</body>
</html>
